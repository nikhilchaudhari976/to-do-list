<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>To-do list</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap">
<style>
:root{--bg:#EEF3F5;--card:#fff;--ink:#17262E;--muted:#6B7D87;--line:#D5E0E5;--accent:#0E7C8B;--accent-ink:#fff;--danger:#B4372F;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1A20;--card:#17262E;--ink:#E6EFF2;--muted:#8DA0AA;--line:#27404C;--accent:#3FB5C4;--accent-ink:#06222A;--danger:#F07A70}}
:root[data-theme="dark"]{--bg:#0F1A20;--card:#17262E;--ink:#E6EFF2;--muted:#8DA0AA;--line:#27404C;--accent:#3FB5C4;--accent-ink:#06222A;--danger:#F07A70}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.4}
main{max-width:560px;margin:0 auto;padding:40px 16px 64px}
h1{font-size:2.4rem;font-weight:800;letter-spacing:-.03em;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 24px}
.add{display:flex;gap:8px;margin-bottom:16px}
input[type=text]{flex:1;min-width:0;font:inherit;padding:12px 14px;border:2px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
input[type=text]:focus{outline:none;border-color:var(--accent)}
button{font:inherit;cursor:pointer;border:0;border-radius:10px}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.add button{background:var(--accent);color:var(--accent-ink);font-weight:600;padding:0 20px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.tabs{display:flex;gap:4px}
.tabs button{background:transparent;color:var(--muted);padding:6px 12px;font-weight:600}
.tabs button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
#count{color:var(--muted);font-size:.9rem}
ul{list-style:none;margin:0;padding:0;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
li{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line)}
li:last-child{border-bottom:0}
li input[type=checkbox]{width:22px;height:22px;accent-color:var(--accent);flex:none;cursor:pointer}
.t{flex:1;min-width:0;word-break:break-word;cursor:text}
li.done .t{color:var(--muted);text-decoration:line-through}
.edit{flex:1;padding:6px 10px}
.del{background:transparent;color:var(--muted);font-size:1.3rem;line-height:1;padding:4px 10px}
.del:hover{color:var(--danger)}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.foot{display:flex;justify-content:flex-end;margin-top:12px}
.clear{background:transparent;color:var(--muted);text-decoration:underline;padding:6px 4px}
.clear:hover{color:var(--danger)}
</style>
</head>
<body>
<main>
  <h1>To-do list</h1>
  <p class="sub">Add a task, tick it off, keep going.</p>
  <div class="add">
    <input type="text" id="new" placeholder="What needs doing?" aria-label="New task" autocomplete="off">
    <button id="addBtn">Add task</button>
  </div>
  <div class="bar">
    <div class="tabs" id="tabs">
      <button data-f="all" aria-pressed="true">All</button>
      <button data-f="active" aria-pressed="false">Active</button>
      <button data-f="done" aria-pressed="false">Done</button>
    </div>
    <span id="count"></span>
  </div>
  <ul id="list"></ul>
  <div class="foot"><button class="clear" id="clear">Clear completed</button></div>
</main>
<script>
(function(){
  var KEY="todo-items-v1", items=[], filter="all";
  try{var s=localStorage.getItem(KEY); if(s) items=JSON.parse(s)||[];}catch(e){items=[];}
  if(!Array.isArray(items)) items=[];
  function save(){try{localStorage.setItem(KEY,JSON.stringify(items));}catch(e){}}
  var $=function(id){return document.getElementById(id)};
  var list=$("list"), input=$("new");

  function add(){
    var v=input.value.trim(); if(!v) return;
    items.unshift({id:Date.now()+Math.random(),text:v,done:false});
    input.value=""; save(); render(); input.focus();
  }
  function render(){
    var shown=items.filter(function(i){return filter==="all"||(filter==="done")===i.done});
    list.innerHTML="";
    if(!shown.length){
      var e=document.createElement("li"); e.className="empty";
      e.textContent=items.length?"Nothing here. Try another filter.":"No tasks yet. Add your first one above.";
      list.appendChild(e);
    }
    shown.forEach(function(it){
      var li=document.createElement("li"); if(it.done) li.className="done";
      var cb=document.createElement("input"); cb.type="checkbox"; cb.checked=it.done;
      cb.setAttribute("aria-label","Mark done: "+it.text);
      cb.onchange=function(){it.done=cb.checked; save(); render();};
      var t=document.createElement("span"); t.className="t"; t.textContent=it.text; t.title="Click to edit";
      t.onclick=function(){startEdit(li,t,it)};
      var d=document.createElement("button"); d.className="del"; d.textContent="\u00D7";
      d.setAttribute("aria-label","Delete task: "+it.text);
      d.onclick=function(){items=items.filter(function(x){return x!==it}); save(); render();};
      li.append(cb,t,d); list.appendChild(li);
    });
    var left=items.filter(function(i){return !i.done}).length;
    $("count").textContent=left+(left===1?" task left":" tasks left");
    $("clear").style.visibility=items.some(function(i){return i.done})?"visible":"hidden";
  }
  function startEdit(li,t,it){
    var ed=document.createElement("input"); ed.type="text"; ed.className="edit"; ed.value=it.text;
    ed.setAttribute("aria-label","Edit task");
    li.replaceChild(ed,t); ed.focus(); ed.select();
    var fin=false;
    function done(ok){ if(fin) return; fin=true;
      var v=ed.value.trim(); if(ok&&v) it.text=v; save(); render(); }
    ed.onkeydown=function(e){ if(e.key==="Enter") done(true); if(e.key==="Escape") done(false); };
    ed.onblur=function(){done(true)};
  }
  $("addBtn").onclick=add;
  input.onkeydown=function(e){if(e.key==="Enter") add()};
  $("clear").onclick=function(){items=items.filter(function(i){return !i.done}); save(); render();};
  $("tabs").onclick=function(e){
    var b=e.target.closest("button"); if(!b) return;
    filter=b.dataset.f;
    Array.prototype.forEach.call($("tabs").children,function(x){x.setAttribute("aria-pressed",x===b)});
    render();
  };
  render();
})();
</script>
</body>
</html>
